name: CI

on:
  push:
    branches: [ main, master, 'claude/**' ]
  pull_request:

permissions:
  contents: read

jobs:
  php:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: [ '7.4', '8.1', '8.3' ]

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer

      - name: Lint every PHP file
        run: |
          set -e
          find . -path ./vendor -prune -o -path ./assets/vendor -prune -o -name '*.php' -print0 \
            | xargs -0 -n1 -P4 php -l

      - name: Smoke test
        run: php tests/smoke.php

  coding-standards:
    name: Coding standards
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer, cs2pr

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      # phpcodesniffer-composer-installer normally does this, but it is skipped
      # whenever composer plugins are disabled — and PHPCS then reports success
      # having checked nothing, which is how this job passed while broken. So
      # the paths are set explicitly and the result is asserted.
      - name: Register the coding standards
        run: |
          set -e
          vendor/bin/phpcs --config-set installed_paths "vendor/wp-coding-standards/wpcs,vendor/phpcompatibility/php-compatibility,vendor/phpcompatibility/phpcompatibility-paragonie,vendor/phpcompatibility/phpcompatibility-wp,vendor/phpcsstandards/phpcsextra,vendor/phpcsstandards/phpcsutils"
          vendor/bin/phpcs -i
          vendor/bin/phpcs -i | grep -q WordPress

      # Errors fail the build; warnings are reported and annotated but do not,
      # because the ones left are deliberate and carry a reason in the code.
      - name: Run PHPCS
        run: vendor/bin/phpcs --report-full --report-checkstyle=./phpcs-report.xml --runtime-set ignore_warnings_on_exit 1

      - name: Annotate the diff
        if: always()
        run: cs2pr ./phpcs-report.xml

  javascript:
    name: JavaScript
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check syntax
        run: |
          set -e
          for file in assets/js/*.js; do
            node --check "$file"
          done

      - name: Validate block metadata
        run: |
          set -e
          for file in blocks/*/block.json; do
            node -e "JSON.parse(require('fs').readFileSync('$file','utf8'))"
          done
